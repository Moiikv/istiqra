      <div class="panel"><div class="ph2"><h4 ar="الإنفاق حسب نوع المنتج" en="Spend by product type"></h4></div><div id="cCats"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="نجمع إنفاق العملاء المختارين خلال آخر سنتين في كل فئة، ونعرض حصة كل فئة من الإجمالي." en="We sum the selected customers&#x27; spend over the last two years per category and show each category&#x27;s share of the total."></p></details></div>
    </div>
    <div class="row r2">
      <div class="panel"><div class="ph2"><h4 ar="الإنفاق والاستجابة حسب الدخل" en="Spend and response by income"></h4><div class="tabs sm" id="iTabs"></div></div><div id="cInc" class="chart"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="نقسّم العملاء المختارين إلى أربع فئات دخل متساوية العدد (حدود الفئات تُحسب على كل العملاء). ثم نحسب متوسط الإنفاق أو نسبة قبول الحملة الأخيرة." en="We split customers into four equal-sized income bands (cut-offs computed on all customers), then show average spend or the last-campaign acceptance rate."></p></details></div>
      <div class="panel"><div class="ph2"><h4 ar="من يستجيب للحملة؟" en="Who responds to the campaign?"></h4><div class="tabs sm" id="rTabs"></div></div><div id="cResp" class="chart"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="نسبة قبول الحملة الأخيرة (Response) حسب عدد الحملات السابقة المقبولة، أو حسب عدد الأيام منذ آخر شراء." en="Acceptance rate of the last campaign (Response) by number of earlier campaigns accepted, or by days since last purchase."></p></details></div>
    </div>
    <div class="row r3">

      <div class="panel"><div class="ph2"><h4 ar="قبول كل حملة" en="Acceptance by campaign"></h4></div><div id="cCmp" class="chart"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="نسبة العملاء الذين قبلوا كل حملة من الحملات الخمس السابقة والحملة الأخيرة. لا تتوفر تواريخ الحملات ولا نوع العرض." en="Share of customers who accepted each of the five earlier campaigns and the last one. Campaign dates and offer types are not in the data."></p></details></div>
    </div>
    <div class="row r4"><div class="panel"><div class="ph2"><h4 ar="ملف العميل: العمر والتعليم والعائلة" en="Customer profile: age, education, family"></h4></div><div class="prof" id="cProf"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="متوسط إنفاق العملاء في كل مجموعة، مع عدد العملاء بين قوسين. المجموعات الصغيرة (أقل من 30 عميلًا) تُعرض بشفافية أقل." en="Average spend of customers in each group, with the customer count in brackets. Small groups (under 30 customers) are shown faded."></p></details></div></div>
    <details class="tv"><summary ar="عرض البيانات كجدول" en="View data as a table"></summary><div class="tw" id="tableView"></div></details>
    <div class="src" ar="المصدر: Customer Personality Analysis (Kaggle) · 2,212 عميلًا بعد التنظيف · الإنفاق خلال آخر سنتين · الاستجابة = قبول الحملة الأخيرة · العملة غير مذكورة في الملف" en="Source: Customer Personality Analysis (Kaggle) · 2,212 customers after cleaning · spend over the last two years · response = accepted the last campaign · currency is not stated in the file"></div>
  </div>
</div></section>
