  <div class="ds rv" id="ds">
    <div class="dh"><div><h3 ar="لوحة كتالوج أمازون الهند" en="Amazon India catalog board"></h3><small id="dsScope"></small></div>
      <div class="fbar" id="fbar"><label class="sel" id="fCat"></label><label class="sel" id="fPrice"></label><label class="sel" id="fDisc"></label><label class="sel" id="fRate"></label><button class="rst" id="fReset" type="button" ar="إعادة ضبط" en="Reset"></button></div></div>

    <div class="row r1">
      <div class="panel"><div class="ph2"><h4 ar="هل الخصم الأكبر يعني تقييمًا أعلى؟" en="Does a bigger discount mean a higher rating?"></h4></div><div id="cDR" class="chart"></div><small class="un" id="drNote"></small><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="نقسّم المنتجات حسب نسبة الخصم، ثم نحسب متوسط التقييم لكل شريحة. المحور يبدأ من 3.5 ليظهر الفرق الصغير، وهذا واضح في التسمية. الارتباط ضعيف ولا يثبت سببًا." en="Products are grouped by discount level and we average the rating of each group. The axis starts at 3.5 so the small gap is visible, and it is labelled. The relationship is weak and proves no cause."></p></details></div>
      <div class="panel"><div class="ph2"><h4 ar="الفئات" en="Categories"></h4><div class="tabs sm" id="cTabs"></div></div><div id="cCats"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="الفئة الفرعية الثانية من مسار التصنيف في أمازون. نعرض أكبر الفئات فقط، والباقي في «أخرى»." en="The second level of Amazon&#x27;s category path. Only the biggest categories are listed; the rest are grouped as “Other”."></p></details></div>
    </div>
    <div class="row r2">
      <div class="panel"><div class="ph2"><h4 ar="الشعبية حسب السعر" en="Popularity by price tier"></h4></div><div id="cPP" class="chart"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="الشعبية = عدد التقييمات (rating_count) وليس المبيعات. نعرض الوسيط لأن عدد قليل من المنتجات يملك مئات الآلاف من التقييمات ويشوّه المتوسط." en="Popularity = rating count, not sales. We show the median because a few products with hundreds of thousands of ratings would distort the mean."></p></details></div>
      <div class="panel"><div class="ph2"><h4 ar="الشعبية حسب الخصم" en="Popularity by discount level"></h4></div><div id="cPD" class="chart"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="وسيط عدد التقييمات لكل شريحة خصم. المنتجات بلا تقييمات مُحتسبة مُستبعدة من هذا الرسم." en="Median rating count per discount level. Products with no rating count are left out of this chart."></p></details></div>
    </div>
    <div class="row r3">
      <div class="panel"><div class="ph2"><h4 ar="توزيع التقييمات" en="Rating distribution"></h4></div><div id="cRD" class="chart"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="عدد المنتجات في كل مستوى تقييم بخطوة 0.2. تتركّز التقييمات بين 3.8 و4.5 تقريبًا." en="Number of products per rating level in 0.2 steps. Ratings cluster between roughly 3.8 and 4.5."></p></details></div>
      <div class="panel"><div class="ph2"><h4 ar="توزيع الأسعار" en="Price distribution"></h4></div><div id="cPR" class="chart"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="عدد المنتجات في كل شريحة سعرية بعد الخصم، بالروبية الهندية." en="Number of products per price tier after discount, in Indian rupees."></p></details></div>
    </div>
    <div class="row r4"><div class="panel"><div class="ph2"><h4 ar="أكثر المنتجات تقييمًا (عددًا)" en="Most-rated products"></h4></div><div class="tw tall" id="cTop"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="نرتّب المنتجات المختارة حسب عدد التقييمات. هذا مؤشر شعبية وليس مبيعات، والنسخ المختلفة من المنتج نفسه تتكرر بالعدد نفسه." en="Selected products ranked by rating count. A popularity signal, not sales; variants of one product repeat the same count."></p></details></div></div>
    <details class="tv"><summary ar="عرض البيانات كجدول" en="View data as a table"></summary><div class="tw" id="tableView"></div></details>
    <div class="src" ar="المصدر: Amazon Sales Dataset (Kaggle) · كتالوج منتجات أمازون الهند · لقطة بلا تواريخ · الأسعار بالروبية الهندية" en="Source: Amazon Sales Dataset (Kaggle) · Amazon India product catalog · a snapshot with no dates · prices in Indian rupees"></div>
  </div>
</div></section>
