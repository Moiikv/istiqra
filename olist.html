<!-- ================= Dashboard ================= -->
<section id="dashboard" class="dash-sec"><div class="w">
  <div class="hd rv"><div><div class="eb" ar="الداشبورد" en="THE DASHBOARD"></div><h2 ar="اسأل البيانات بنفسك." en="Ask the data yourself."></h2></div><p ar="كل رسم يتحدّث مع الفلاتر. اضغط على ولاية في الخريطة لتصفية كل شيء." en="Every chart answers the filters. Click a state on the map to filter everything."></p></div>
  <div class="ds rv" id="ds">
    <div class="dh">
      <div><h3 ar="لوحة أداء Olist" en="Olist performance board"></h3><small id="dsScope"></small></div>
      <div class="fbar" id="fbar">
        <div class="tabs" id="presets"></div>
        <label class="sel"><span class="sr" ar="من" en="From"></span><select id="fFrom"></select></label><span class="dash">–</span>
        <label class="sel"><span class="sr" ar="إلى" en="To"></span><select id="fTo"></select></label>
        <label class="sel"><span class="sr" ar="الولاية" en="State"></span><select id="fState"></select></label>
        <button class="rst" id="fReset" type="button" ar="إعادة ضبط" en="Reset"></button>
      </div>
    </div>
    <div class="kp6" id="kpis"></div>
    <div class="row r1">
      <div class="panel"><div class="ph2"><h4 id="tTrend"></h4><div class="tabs sm" id="mTabs"></div></div><div id="cTrend" class="chart"></div><small class="un" id="trendNote"></small><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="نجمع الطلبات المُسلَّمة حسب شهر الشراء. الإيراد = مجموع سعر المنتجات (بدون الشحن). الخط المنقط يقارن بالفترة السابقة المساوية في الطول." en="We group delivered orders by purchase month. Revenue = sum of item prices (freight excluded). Deltas compare with the previous period of equal length."></p></details></div>
      <div class="panel"><div class="ph2"><h4 ar="الإيرادات حسب الفئة" en="Revenue by category"></h4></div><div id="cCats"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="نربط كل بند طلب بفئة المنتج (مترجمة من البرتغالية) ونجمع السعر. تظهر أعلى 8 فئات ويُجمع الباقي." en="Each order item is joined to its product category (translated from Portuguese) and prices are summed. The top 8 are shown, the rest are grouped."></p></details><small class="un" ar="أعلى 8 فئات من أصل 72 · بالألف ريال" en="Top 8 of 72 categories · thousand BRL"></small></div>
    </div>
    <div class="row r2">
      <div class="panel"><div class="ph2"><h4 ar="خريطة الولايات" en="State map"></h4><div class="tabs sm" id="tTabs"></div></div><div id="cTiles"></div><div class="scale" id="tScale"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="كل مربع ولاية، ولونه يعبّر عن القيمة المختارة. الولاية هي ولاية العميل وليس البائع. المتوسطات موزونة بعدد الطلبات." en="Each tile is a state; colour shows the chosen measure. State means the customer state, not the seller. Averages are weighted by order count."></p></details></div>
      <div class="panel" id="stPanel"></div>
    </div>
    <div class="row r3">
      <div class="panel"><div class="ph2"><h4 ar="التأخير في التوصيل مقابل التقييم" en="Delivery delay vs review score"></h4></div><div id="cDel" class="chart"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="نقسّم الطلبات حسب الفرق بين تاريخ التسليم والتاريخ المقدّر، ثم نحسب متوسط التقييم لكل شريحة. هذا ارتباط وليس إثبات سبب." en="Orders are bucketed by the gap between delivery and the estimated date, then average review is computed per bucket. This is correlation, not proof of cause."></p></details><small class="un" ar="متوسط التقييم (من 5) حسب التأخير عن الموعد المُقدَّر" en="Average review (of 5) by delay vs the estimated date"></small></div>
      <div class="panel"><div class="ph2"><h4 ar="طرق الدفع" en="Payment methods"></h4></div><div id="cPay"></div><div class="inst" id="cInst"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="نجمع قيمة المدفوعات حسب النوع. الطلب الواحد قد يُدفع بأكثر من طريقة، لذلك عدد المدفوعات أكبر من عدد الطلبات." en="Payment value is summed by type. One order can use several methods, so payments outnumber orders."></p></details></div>
    </div>
    <div class="row r4"><div class="panel"><div class="ph2"><h4 ar="متى يشتري العملاء؟" en="When do customers buy?"></h4><small class="un" id="heatNote"></small></div><div id="cHeat"></div><details class="how"><summary ar="كيف يُحسب هذا الرسم؟" en="How is this chart built?"></summary><p ar="نعدّ الطلبات حسب يوم الأسبوع وساعة الشراء (بالتوقيت المسجّل في البيانات). اللون الأغمق = طلبات أكثر." en="Orders are counted by weekday and purchase hour (as recorded in the data). Darker = more orders."></p></details></div></div>
    <details class="tv"><summary ar="عرض البيانات كجدول" en="View data as a table"></summary><div class="tw" id="tableView"></div></details>
    <div class="src" ar="المصدر: Olist Brazilian E-Commerce (Kaggle) · الطلبات المُسلَّمة فقط · الإيراد = مجموع أسعار المنتجات بدون الشحن · يناير 2017 – أغسطس 2018" en="Source: Olist Brazilian E-Commerce (Kaggle) · delivered orders only · revenue = sum of item prices excluding freight · Jan 2017 – Aug 2018"></div>
    <div class="pbi" id="pbi" hidden></div>
  </div>
</div></section>
